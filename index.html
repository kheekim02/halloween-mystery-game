<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>할로윈 파티룸: 붉은 호박의 밤 | 머더 미스터리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pumpkin: {
              400: '#ff9233',
              500: '#ff7300',
              600: '#e65c00'
            },
            crimson: {
              500: '#e63946',
              600: '#c52233',
              700: '#9b111e'
            },
            gothic: {
              900: '#0d0b14',
              800: '#171424',
              700: '#231e36',
              600: '#322b4d'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0b14;
      color: #f3f4f6;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #171424;
    }
    ::-webkit-scrollbar-thumb {
      background: #322b4d;
      border-radius: 3px;
    }
    .neon-glow-orange {
      text-shadow: 0 0 10px rgba(255, 115, 0, 0.6), 0 0 20px rgba(255, 115, 0, 0.3);
    }
    .neon-glow-red {
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.7), 0 0 25px rgba(230, 57, 70, 0.4);
    }
    .card-glass {
      background: rgba(23, 20, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 115, 0, 0.2);
    }
    .card-glass-red {
      background: rgba(23, 20, 36, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 57, 70, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 selection:bg-pumpkin-500 selection:text-white">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-50 bg-gothic-900/95 backdrop-blur-md border-b border-pumpkin-500/20 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2">
      <span class="text-2xl animate-pulse">🎃</span>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
          <span>붉은 호박의 밤</span>
          <span class="text-[10px] bg-pumpkin-500/20 text-pumpkin-400 px-1.5 py-0.5 rounded border border-pumpkin-500/30 font-medium">60분 추리</span>
        </h1>
        <p class="text-[10px] text-gray-400" id="current-user-badge">플레이어를 선택하세요</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 60m TIMER BADGE -->
      <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex items-center space-x-1.5 bg-gothic-800 border border-pumpkin-500/30 hover:border-pumpkin-500 px-2.5 py-1 rounded-full text-xs font-mono text-pumpkin-400 shadow-inner">
        <i class="fa-solid fa-clock text-[11px] text-pumpkin-500"></i>
        <span id="timer-display" class="font-bold">60:00</span>
      </button>

      <!-- BGM SOUND TOGGLE -->
      <button onclick="toggleAudio()" id="bgm-btn" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs">
        <i class="fa-solid fa-volume-xmark" id="bgm-icon"></i>
      </button>

      <!-- SWITCH ROLE -->
      <button onclick="openSelectRoleModal()" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs" title="내 역할 변경">
        <i class="fa-solid fa-user-gear"></i>
      </button>
    </div>
  </header>

  <!-- STAGE PROGRESS BAR -->
  <div class="bg-gothic-800/80 px-4 py-2 border-b border-gray-800 flex items-center justify-between overflow-x-auto text-[11px] no-scrollbar">
    <div class="flex items-center space-x-2 min-w-max" id="stage-tabs-container">
      <button onclick="changeStage(0)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40" data-stage="0">0. 사건발생</button>
      <button onclick="changeStage(1)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200" data-stage="1">1. 참가자&코스튬</button>
      <button onclick="changeStage(2)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200" data-stage="2">2. 1차 단서수색</button>
      <button onclick="changeStage(3)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200" data-stage="3">3. 2차 심층수색</button>
      <button onclick="changeStage(4)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200" data-stage="4">4. 비밀투표</button>
      <button onclick="changeStage(5)" class="stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200" data-stage="5">5. 진범공개</button>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4" id="app-viewport">
    <!-- Dynamic views injected here by app.js -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-gothic-900/95 backdrop-blur-lg border-t border-gray-800 max-w-xl mx-auto px-4 py-2 flex items-center justify-around shadow-2xl">
    <button onclick="setTab('role')" id="nav-btn-role" class="nav-btn flex flex-col items-center justify-center text-pumpkin-400">
      <i class="fa-solid fa-id-card-clip text-lg mb-0.5"></i>
      <span class="text-[10px] font-semibold">내 비밀역할</span>
    </button>
    <button onclick="setTab('story')" id="nav-btn-story" class="nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300">
      <i class="fa-solid fa-book-skull text-lg mb-0.5"></i>
      <span class="text-[10px] font-semibold">사건현장</span>
    </button>
    <button onclick="setTab('clues')" id="nav-btn-clues" class="nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 relative">
      <i class="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
      <span class="text-[10px] font-semibold">단서보관소</span>
      <span id="clue-badge-count" class="absolute -top-1 -right-2 bg-crimson-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>
    <button onclick="setTab('players')" id="nav-btn-players" class="nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300">
      <i class="fa-solid fa-masks-theater text-lg mb-0.5"></i>
      <span class="text-[10px] font-semibold">용의자7인</span>
    </button>
    <button onclick="setTab('vote')" id="nav-btn-vote" class="nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300">
      <i class="fa-solid fa-check-to-slot text-lg mb-0.5"></i>
      <span class="text-[10px] font-semibold">지목투표</span>
    </button>
  </nav>

  <!-- ROLE SELECT MODAL (LOGIN) -->
  <div id="role-select-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass rounded-2xl max-w-md w-full p-5 border border-pumpkin-500/40 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="text-center space-y-1">
        <div class="inline-block p-3 rounded-full bg-pumpkin-500/10 border border-pumpkin-500/30 text-pumpkin-400 text-2xl mb-1 animate-bounce">
          🎃
        </div>
        <h2 class="text-lg font-bold text-white tracking-tight">당신의 이름을 선택하세요</h2>
        <p class="text-xs text-gray-400">배정된 역할지에는 극비 미션과 비밀이 담겨 있습니다.</p>
      </div>

      <!-- PLAYER LIST -->
      <div class="space-y-2" id="modal-player-list">
        <!-- Rendered by JS -->
      </div>

      <!-- COSTUME INPUT -->
      <div class="pt-2 border-t border-gray-800 space-y-2">
        <label class="block text-xs font-semibold text-pumpkin-400 flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>오늘 입고 온 할로윈 코스튬은?</span>
        </label>
        <input type="text" id="input-costume" placeholder="예: 스파이더맨, 해리포터, 삐에로, 공룡잠옷..." 
               class="w-full bg-gothic-900 border border-gray-700 focus:border-pumpkin-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 outline-none transition-all">
        <p class="text-[10px] text-gray-400">입력한 코스튬은 다른 친구들의 프로필과 단서에 실시간 반영됩니다.</p>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="confirmRoleSelection()" class="flex-1 bg-gradient-to-r from-pumpkin-600 to-pumpkin-500 hover:from-pumpkin-500 hover:to-pumpkin-400 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-pumpkin-500/20">
          내 역할 확인하고 시작하기
        </button>
      </div>
    </div>
  </div>

  <!-- CLUE DETAIL MODAL -->
  <div id="clue-detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass-red rounded-2xl max-w-md w-full p-5 border border-crimson-500/50 shadow-2xl space-y-3 max-h-[85vh] overflow-y-auto">
      <div class="flex items-start justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-xl text-crimson-500" id="modal-clue-icon">🔍</span>
          <div>
            <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider" id="modal-clue-location">장소</span>
            <h3 class="text-base font-bold text-white" id="modal-clue-title">단서 명</h3>
          </div>
        </div>
        <button onclick="closeClueModal()" class="w-7 h-7 rounded-full bg-gothic-800 flex items-center justify-center text-gray-400 hover:text-white text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3 bg-gothic-900/80 rounded-xl border border-gray-800 space-y-2">
        <p class="text-xs text-gray-200 leading-relaxed whitespace-pre-line" id="modal-clue-desc"></p>
      </div>

      <div class="p-3 bg-crimson-900/20 rounded-xl border border-crimson-500/30">
        <div class="flex items-center space-x-1.5 text-crimson-400 text-xs font-bold mb-1">
          <i class="fa-solid fa-lightbulb"></i>
          <span>수사 힌트 / 추리 분석</span>
        </div>
        <p class="text-[11px] text-gray-300 leading-normal" id="modal-clue-hint"></p>
      </div>

      <button onclick="closeClueModal()" class="w-full bg-gothic-800 hover:bg-gothic-700 text-gray-200 font-semibold py-2 rounded-xl text-xs transition-all border border-gray-700">
        닫기
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Global State
    let GAME_DATA = null;
    let currentUser = null; // Character ID
    let currentTab = 'role'; // 'role', 'story', 'clues', 'players', 'vote'
    let currentStage = 0; // 0 to 5
    let userCostumes = {}; // { char_id: '드라큘라' }
    let votes = {}; // { voter_id: target_id }
    let timerSeconds = 3600; // 60 minutes
    let timerInterval = null;
    let isTimerRunning = false;
    let audioCtx = null;
    let isAudioPlaying = false;

    // Load Scenario Data
    async function initApp() {
      try {
        const response = await fetch('scenario.json');
        GAME_DATA = await response.json();
        
        // Restore local storage if exists
        loadLocalStorage();

        // Render initial UI
        renderHeader();
        if (!currentUser) {
          openSelectRoleModal();
        } else {
          renderCurrentTab();
        }
      } catch (err) {
        console.error('Failed to load scenario data:', err);
      }
    }

    function loadLocalStorage() {
      const savedUser = localStorage.getItem('mystery_user');
      if (savedUser) currentUser = savedUser;

      const savedCostumes = localStorage.getItem('mystery_costumes');
      if (savedCostumes) userCostumes = JSON.parse(savedCostumes);

      const savedStage = localStorage.getItem('mystery_stage');
      if (savedStage !== null) currentStage = parseInt(savedStage, 10);

      const savedVotes = localStorage.getItem('mystery_votes');
      if (savedVotes) votes = JSON.parse(savedVotes);
    }

    function saveLocalStorage() {
      if (currentUser) localStorage.setItem('mystery_user', currentUser);
      localStorage.setItem('mystery_costumes', JSON.stringify(userCostumes));
      localStorage.setItem('mystery_stage', currentStage.toString());
      localStorage.setItem('mystery_votes', JSON.stringify(votes));
    }

    // Role Selection Modal
    function openSelectRoleModal() {
      const container = document.getElementById('modal-player-list');
      container.innerHTML = '';

      GAME_DATA.characters.forEach(char => {
        const isSelected = currentUser === char.id;
        const costume = userCostumes[char.id] || '코스튬 미입력';

        const btn = document.createElement('div');
        btn.className = `p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${
          isSelected 
            ? 'bg-pumpkin-500/20 border-pumpkin-500 text-white' 
            : 'bg-gothic-900/60 border-gray-800 text-gray-300 hover:border-gray-700'
        }`;
        btn.onclick = () => selectTempRole(char.id);
        btn.id = `modal-btn-${char.id}`;

        btn.innerHTML = `
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-full bg-gothic-800 border border-pumpkin-500/30 flex items-center justify-center text-xs font-bold text-pumpkin-400">
              ${char.real_name.charAt(0)}
            </div>
            <div>
              <div class="text-xs font-bold text-white flex items-center gap-1.5">
                <span>${char.real_name}</span>
                <span class="text-[10px] text-gray-400">(${char.birth_year})</span>
              </div>
              <div class="text-[10px] text-pumpkin-400/90">${char.character_name} · ${char.role_title}</div>
            </div>
          </div>
          <div class="text-right">
            <span class="text-[9px] px-2 py-0.5 rounded-full bg-gothic-800 border border-gray-700 text-gray-300">
              🎭 ${costume}
            </span>
          </div>
        `;
        container.appendChild(btn);
      });

      if (currentUser && userCostumes[currentUser]) {
        document.getElementById('input-costume').value = userCostumes[currentUser];
      }

      document.getElementById('role-select-modal').classList.remove('hidden');
    }

    let tempSelectedRole = null;
    function selectTempRole(charId) {
      tempSelectedRole = charId;
      document.querySelectorAll('#modal-player-list > div').forEach(el => {
        el.className = el.className.replace('bg-pumpkin-500/20 border-pumpkin-500 text-white', 'bg-gothic-900/60 border-gray-800 text-gray-300');
      });
      const selectedEl = document.getElementById(`modal-btn-${charId}`);
      if (selectedEl) {
        selectedEl.className = selectedEl.className.replace('bg-gothic-900/60 border-gray-800 text-gray-300', 'bg-pumpkin-500/20 border-pumpkin-500 text-white');
      }
      if (userCostumes[charId]) {
        document.getElementById('input-costume').value = userCostumes[charId];
      }
    }

    function confirmRoleSelection() {
      if (!tempSelectedRole && !currentUser) {
        alert('역할을 선택해 주세요!');
        return;
      }
      if (tempSelectedRole) {
        currentUser = tempSelectedRole;
      }

      const costumeInput = document.getElementById('input-costume').value.trim();
      if (costumeInput) {
        userCostumes[currentUser] = costumeInput;
      } else if (!userCostumes[currentUser]) {
        userCostumes[currentUser] = '할로윈 분장';
      }

      saveLocalStorage();
      document.getElementById('role-select-modal').classList.add('hidden');
      renderHeader();
      renderCurrentTab();
    }

    function renderHeader() {
      if (!currentUser || !GAME_DATA) return;
      const char = GAME_DATA.characters.find(c => c.id === currentUser);
      if (char) {
        const costume = userCostumes[char.id] ? `(${userCostumes[char.id]})` : '';
        document.getElementById('current-user-badge').innerHTML = `
          <span class="text-pumpkin-400 font-bold">${char.real_name}</span> 
          <span class="text-gray-400">${char.character_name.split(' ')[1] || ''} ${costume}</span>
        `;
      }
      updateClueBadgeCount();
      updateStageTabStyles();
    }

    function updateClueBadgeCount() {
      if (!GAME_DATA) return;
      // Filter clues available up to currentStage
      const availableClues = GAME_DATA.clues.filter(c => {
        if (currentStage >= 3) return true; // all clues in stage 3+
        if (currentStage === 2) return c.stage === 1; // stage 1 clues
        return false;
      });
      document.getElementById('clue-badge-count').innerText = availableClues.length;
    }

    function updateStageTabStyles() {
      document.querySelectorAll('.stage-tab').forEach(tab => {
        const stageNum = parseInt(tab.dataset.stage, 10);
        if (stageNum === currentStage) {
          tab.className = 'stage-tab px-2.5 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40';
        } else {
          tab.className = 'stage-tab px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-gray-200';
        }
      });
    }

    function changeStage(newStage) {
      currentStage = newStage;
      saveLocalStorage();
      updateStageTabStyles();
      updateClueBadgeCount();
      renderCurrentTab();
    }

    function setTab(tabName) {
      currentTab = tabName;
      // Update nav buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300';
      });
      const activeBtn = document.getElementById(`nav-btn-${tabName}`);
      if (activeBtn) {
        activeBtn.className = 'nav-btn flex flex-col items-center justify-center text-pumpkin-400';
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('app-viewport');
      container.innerHTML = '';

      switch (currentTab) {
        case 'role':
          renderRoleTab(container);
          break;
        case 'story':
          renderStoryTab(container);
          break;
        case 'clues':
          renderCluesTab(container);
          break;
        case 'players':
          renderPlayersTab(container);
          break;
        case 'vote':
          renderVoteTab(container);
          break;
      }
    }

    // 1. ROLE TAB
    function renderRoleTab(container) {
      if (!currentUser) return;
      const char = GAME_DATA.characters.find(c => c.id === currentUser);
      const costume = userCostumes[char.id] || '자유 코스튬';

      const isCulprit = char.is_culprit;

      const card = document.createElement('div');
      card.className = 'space-y-4';
      card.innerHTML = `
        <!-- TOP ID CARD -->
        <div class="card-glass rounded-2xl p-4 border ${isCulprit ? 'border-crimson-500/50 shadow-crimson-600/20' : 'border-pumpkin-500/30'} shadow-xl relative overflow-hidden">
          ${isCulprit ? `
            <div class="absolute -right-12 top-4 bg-crimson-600 text-white text-[10px] font-extrabold uppercase px-12 py-1 rotate-45 shadow">
              진범 (CULPRIT)
            </div>
          ` : ''}

          <div class="flex items-center space-x-3 mb-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-pumpkin-500 to-crimson-600 flex items-center justify-center text-xl font-bold text-white shadow-lg">
              ${char.real_name.charAt(0)}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-base font-bold text-white tracking-tight">${char.real_name}</h2>
                <span class="text-xs text-gray-400">${char.birth_year}</span>
              </div>
              <p class="text-xs font-semibold text-pumpkin-400">${char.character_name} · ${char.role_title}</p>
            </div>
          </div>

          <div class="bg-gothic-900/80 rounded-xl p-3 border border-gray-800 space-y-1.5 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-gray-400">오늘의 코스튬:</span>
              <span class="text-white font-bold bg-pumpkin-500/20 px-2 py-0.5 rounded border border-pumpkin-500/30">
                🎭 ${costume}
              </span>
            </div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-gray-400 shrink-0">성격 & 연기 팁:</span>
              <span class="text-gray-200 text-right font-medium">${char.personality}</span>
            </div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-gray-400 shrink-0">피해자와의 관계:</span>
              <span class="text-gray-200 text-right">${char.relationship}</span>
            </div>
          </div>
        </div>

        <!-- PUBLIC ALIBI -->
        <div class="card-glass rounded-2xl p-4 border border-gray-800 space-y-2">
          <div class="flex items-center space-x-2 text-xs font-bold text-gray-300">
            <i class="fa-solid fa-bullhorn text-pumpkin-400"></i>
            <span>모두에게 공개할 나의 1차 알리바이</span>
          </div>
          <div class="p-3 bg-gothic-900/60 rounded-xl border border-gray-800 text-xs text-gray-200 leading-relaxed">
            "${char.alibi}"
          </div>
        </div>

        <!-- SECRET & MOTIVE -->
        <div class="card-glass-red rounded-2xl p-4 border border-crimson-500/40 space-y-2 shadow-lg">
          <div class="flex items-center justify-between">

    // 60-Minute Countdown Timer
    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('timer-display').classList.remove('text-crimson-400');
      } else {
        isTimerRunning = true;
        document.getElementById('timer-display').classList.add('text-crimson-400');
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            alert('⏰ 60분이 종료되었습니다! 최종 투표를 진행하세요!');
          }
        }, 1000);
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Audio / BGM Synthesizer (Spooky Ambient Synth using Web Audio API)
    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const icon = document.getElementById('bgm-icon');

      if (isAudioPlaying) {
        if (window.bgmOsc) {
          window.bgmOsc.stop();
          window.bgmOsc.disconnect();
        }
        isAudioPlaying = false;
        icon.className = 'fa-solid fa-volume-xmark text-gray-400';
      } else {
        playSpookyTone();
        isAudioPlaying = true;
        icon.className = 'fa-solid fa-volume-high text-pumpkin-400 animate-pulse';
      }
    }

    function playSpookyTone() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(65.41, audioCtx.currentTime); // Low C2
      
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      // Low pass filter
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(250, audioCtx.currentTime);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      window.bgmOsc = osc;
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
