<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>할로윈 파티룸: 붉은 호박의 밤 | 머더 미스터리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pumpkin: {
              400: '#ff9233',
              500: '#ff7300',
              600: '#e65c00'
            },
            crimson: {
              500: '#e63946',
              600: '#c52233',
              700: '#9b111e'
            },
            gothic: {
              900: '#0d0b14',
              800: '#171424',
              700: '#231e36',
              600: '#322b4d'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0b14;
      color: #f3f4f6;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #171424;
    }
    ::-webkit-scrollbar-thumb {
      background: #322b4d;
      border-radius: 3px;
    }
    .neon-glow-orange {
      text-shadow: 0 0 10px rgba(255, 115, 0, 0.6), 0 0 20px rgba(255, 115, 0, 0.3);
    }
    .neon-glow-red {
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.7), 0 0 25px rgba(230, 57, 70, 0.4);
    }
    .card-glass {
      background: rgba(23, 20, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 115, 0, 0.2);
    }
    .card-glass-red {
      background: rgba(23, 20, 36, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 57, 70, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 selection:bg-pumpkin-500 selection:text-white">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-50 bg-gothic-900/95 backdrop-blur-md border-b border-pumpkin-500/20 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2.5">
      <span class="text-2xl animate-pulse">🎃</span>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white">
          <span>붉은 호박의 밤</span>
        </h1>
        <p class="text-xs text-gray-300 font-medium" id="current-user-badge">플레이어를 선택하세요</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 60m TIMER BADGE -->
      <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex items-center space-x-1.5 bg-gothic-800 border border-pumpkin-500/40 hover:border-pumpkin-500 px-3 py-1.5 rounded-full text-xs font-mono text-pumpkin-400 shadow-inner group transition-all" title="클릭하여 타이머 시작/일시정지">
        <span id="timer-icon" class="text-xs text-pumpkin-500">▶</span>
        <span id="timer-display" class="font-bold text-xs">60:00</span>
      </button>

      <!-- BGM SOUND TOGGLE -->
      <button onclick="toggleAudio()" id="bgm-btn" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs">
        <i class="fa-solid fa-volume-xmark" id="bgm-icon"></i>
      </button>

      <!-- SWITCH ROLE -->
      <button onclick="openSelectRoleModal()" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs" title="내 역할 변경">
        <i class="fa-solid fa-user-gear"></i>
      </button>
    </div>
  </header>

  <!-- STAGE PROGRESS BAR -->
  <div class="bg-gothic-800/90 px-3 py-2 border-b border-gray-800 flex items-center gap-2 overflow-x-auto text-xs no-scrollbar">
    <div class="flex items-center gap-1 text-xs text-gray-400 font-bold shrink-0 pl-1">
      <i class="fa-solid fa-flag-checkered text-pumpkin-500"></i>
      <span>진행:</span>
    </div>
    <div class="flex items-center space-x-1.5 min-w-max" id="stage-tabs-container">
      <button onclick="changeStage(0)" class="stage-tab px-3 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40 text-xs" data-stage="0">0. 사건발생</button>
      <button onclick="changeStage(1)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="1">1. 참가자 소개</button>
      <button onclick="changeStage(2)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="2">2. 1차 구역수색</button>
      <button onclick="changeStage(3)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="3">3. 1차 중간투표</button>
      <button onclick="changeStage(4)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="4">4. 2차 심층수색</button>
      <button onclick="changeStage(5)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="5">5. 최종투표</button>
      <button onclick="changeStage(6)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="6">6. 진범공개</button>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4" id="app-viewport">
    <!-- Dynamic views injected here by app.js -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-gothic-900/95 backdrop-blur-lg border-t border-gray-800 max-w-xl mx-auto px-4 py-2 flex items-center justify-around shadow-2xl">
    <button onclick="setTab('role')" id="nav-btn-role" class="nav-btn flex flex-col items-center justify-center text-pumpkin-400">
      <i class="fa-solid fa-id-card-clip text-lg mb-0.5"></i>
      <span class="text-xs font-bold">내 비밀역할</span>
    </button>
    <button onclick="setTab('story')" id="nav-btn-story" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-book-skull text-lg mb-0.5"></i>
      <span class="text-xs font-bold">사건&타임라인</span>
    </button>
    <button onclick="setTab('clues')" id="nav-btn-clues" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200 relative">
      <i class="fa-solid fa-compass-drafting text-lg mb-0.5"></i>
      <span class="text-xs font-bold">현장수색</span>
      <span id="clue-badge-count" class="absolute -top-1 -right-2 bg-crimson-600 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>
    <button onclick="setTab('players')" id="nav-btn-players" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-masks-theater text-lg mb-0.5"></i>
      <span class="text-xs font-bold">용의자8인</span>
    </button>
    <button onclick="setTab('vote')" id="nav-btn-vote" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-check-to-slot text-lg mb-0.5"></i>
      <span class="text-xs font-bold">투표/결과</span>
    </button>
  </nav>

  <!-- ROLE SELECT MODAL (LOGIN) -->
  <div id="role-select-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass rounded-2xl max-w-md w-full p-5 border border-pumpkin-500/40 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="text-center space-y-1">
        <div class="inline-block p-3 rounded-full bg-pumpkin-500/10 border border-pumpkin-500/30 text-pumpkin-400 text-2xl mb-1 animate-bounce">
          🎃
        </div>
        <h2 class="text-lg font-bold text-white tracking-tight">당신의 이름을 선택하세요</h2>
        <p class="text-xs text-gray-400">배정된 역할지에는 극비 미션과 비밀이 담겨 있습니다.</p>
      </div>

      <!-- PLAYER LIST -->
      <div class="space-y-2" id="modal-player-list">
        <!-- Rendered by JS -->
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="confirmRoleSelection()" class="flex-1 bg-gradient-to-r from-pumpkin-600 to-pumpkin-500 hover:from-pumpkin-500 hover:to-pumpkin-400 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-pumpkin-500/20">
          내 역할 확인하고 시작하기
        </button>
      </div>
    </div>
  </div>

  <!-- CLUE DETAIL MODAL -->
  <div id="clue-detail-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass-red rounded-2xl max-w-md w-full p-5 border border-crimson-500/60 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <!-- Modal Header -->
      <div class="flex items-start justify-between border-b border-gray-800 pb-3">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-xs font-mono font-bold text-pumpkin-400 bg-pumpkin-500/20 px-2.5 py-0.5 rounded-full border border-pumpkin-500/30" id="modal-clue-badge">증거물</span>
            <span class="text-xs font-mono text-gray-300" id="modal-clue-location">장소</span>
          </div>
          <h3 class="text-xl font-bold text-white tracking-tight" id="modal-clue-title">단서 명</h3>
        </div>
        <button onclick="closeClueModal()" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-300 hover:text-white text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Clear HTML Text Panel -->
      <div class="p-4 bg-gothic-900/90 rounded-xl border border-gray-800 space-y-2.5 shadow-inner">
        <div class="flex items-center justify-between text-xs font-bold text-gray-400 border-b border-gray-800 pb-1.5">
          <span class="flex items-center gap-1.5 text-pumpkin-400">
            <i class="fa-solid fa-file-shield"></i>
            <span>현장 수사 분석 보고서</span>
          </span>
          <span class="text-emerald-400 font-mono">STATUS: CONFIRMED</span>
        </div>
        <p class="text-sm text-gray-100 leading-relaxed whitespace-pre-line font-medium pt-1" id="modal-clue-desc"></p>
      </div>

      <button onclick="closeClueModal()" class="w-full bg-gothic-800 hover:bg-gothic-700 text-white font-bold py-3 rounded-xl text-sm transition-all border border-gray-700 shadow-md">
        확인 완료 (닫기)
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Global State
    let GAME_DATA = null;
    let currentUser = null; // Character ID
    let currentTab = 'role'; // 'role', 'story', 'clues', 'players', 'vote'
    let currentStage = 0; // 0 to 6
    let unlockedStage = 0; // 최대 해금된 단계 (이전 단계 복습만 가능, 미래 단계는 순차 해금)
    let userCostumes = {}; // { char_id: '드라큘라' }
    let votes = {}; // { voter_id: target_id } -> final votes
    let midtermVotes = {}; // { voter_id: target_id } -> 1차 중간 투표
    let isMidtermRevealed = false; // 1차 투표 마감 및 결과 전체 공개 여부
    let isFinalRevealed = false; // 최종 투표 마감 및 결과 전체 공개 여부
    let userZoneInvestigations = {}; // { [charId]: 'zone_id' } -> 1차 구역 수색 (1곳)
    let userInvestigations = {}; // { [charId]: ['target1', 'target2'] } -> 2차 인물 수색 (2명)
    let userNotes = {}; // { [charId]: { stars: 0, memo: '' } } -> 비공개 개인 수첩
    let timerSeconds = 3600; // 60 minutes
    let timerInterval = null;
    let isTimerRunning = false;
    let audioCtx = null;
    let isAudioPlaying = false;

    // Load Scenario Data
    async function initApp() {
      try {
        const response = await fetch('scenario.json');
        GAME_DATA = await response.json();
        
        // Restore local storage if exists
        loadLocalStorage();

        // Render initial UI
        renderHeader();
        if (!currentUser) {
          openSelectRoleModal();
        } else {
          renderCurrentTab();
        }
      } catch (err) {
        console.error('Failed to load scenario data:', err);
      }
    }

    function loadLocalStorage() {
      // Clean production reset (v1.4.0: progressive stage unlocking & unified voting actions)
      const APP_VERSION = 'v1.4.0-progressive';
      if (localStorage.getItem('mystery_app_version') !== APP_VERSION) {
        localStorage.clear();
        localStorage.setItem('mystery_app_version', APP_VERSION);
        currentUser = null;
        currentStage = 0;
        unlockedStage = 0;
        votes = {};
        midtermVotes = {};
        isMidtermRevealed = false;
        isFinalRevealed = false;
        userZoneInvestigations = {};
        userInvestigations = {};
        userNotes = {};
        return;
      }
      const savedUser = localStorage.getItem('mystery_user');
      if (savedUser) currentUser = savedUser;

      const savedCostumes = localStorage.getItem('mystery_costumes');
      if (savedCostumes) userCostumes = JSON.parse(savedCostumes);

      const savedStage = localStorage.getItem('mystery_stage');
      if (savedStage !== null) currentStage = parseInt(savedStage, 10);

      const savedUnlocked = localStorage.getItem('mystery_unlocked_stage');
      if (savedUnlocked !== null) {
        unlockedStage = parseInt(savedUnlocked, 10);
      } else {
        unlockedStage = currentStage;
      }

      const savedVotes = localStorage.getItem('mystery_votes');
      if (savedVotes) votes = JSON.parse(savedVotes);

      const savedMidterm = localStorage.getItem('mystery_midterm_votes');
      if (savedMidterm) midtermVotes = JSON.parse(savedMidterm);

      const savedMidtermRev = localStorage.getItem('mystery_midterm_revealed');
      if (savedMidtermRev !== null) isMidtermRevealed = (savedMidtermRev === 'true');

      const savedFinalRev = localStorage.getItem('mystery_final_revealed');
      if (savedFinalRev !== null) isFinalRevealed = (savedFinalRev === 'true');

      const savedZoneInv = localStorage.getItem('mystery_zone_inv');
      if (savedZoneInv) userZoneInvestigations = JSON.parse(savedZoneInv);

      const savedInv = localStorage.getItem('mystery_investigations');
      if (savedInv) userInvestigations = JSON.parse(savedInv);

      const savedNotes = localStorage.getItem('mystery_user_notes');
      if (savedNotes) userNotes = JSON.parse(savedNotes);
    }

    function saveLocalStorage() {
      if (currentUser) localStorage.setItem('mystery_user', currentUser);
      localStorage.setItem('mystery_costumes', JSON.stringify(userCostumes));
      localStorage.setItem('mystery_stage', currentStage.toString());
      localStorage.setItem('mystery_unlocked_stage', unlockedStage.toString());
      localStorage.setItem('mystery_votes', JSON.stringify(votes));
      localStorage.setItem('mystery_midterm_votes', JSON.stringify(midtermVotes));
      localStorage.setItem('mystery_midterm_revealed', isMidtermRevealed.toString());
      localStorage.setItem('mystery_final_revealed', isFinalRevealed.toString());
      localStorage.setItem('mystery_zone_inv', JSON.stringify(userZoneInvestigations));
      localStorage.setItem('mystery_investigations', JSON.stringify(userInvestigations));
      localStorage.setItem('mystery_user_notes', JSON.stringify(userNotes));
    }

    // Role Selection Modal
    function openSelectRoleModal() {
      const container = document.getElementById('modal-player-list');
      container.innerHTML = '';

      GAME_DATA.characters.forEach(char => {
        const isSelected = currentUser === char.id;

        const btn = document.createElement('div');
        btn.className = `p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2.5 ${
          isSelected 
            ? 'bg-pumpkin-500/20 border-pumpkin-500 text-white' 
            : 'bg-gothic-900/60 border-gray-800 text-gray-300 hover:border-gray-700'
        }`;
        btn.onclick = () => selectTempRole(char.id);
        btn.id = `modal-btn-${char.id}`;

        btn.innerHTML = `
          <div class="flex items-center space-x-2.5 min-w-0 flex-1">
            <div class="w-8 h-8 rounded-full shrink-0 bg-gothic-800 border border-pumpkin-500/30 flex items-center justify-center text-xs font-bold text-pumpkin-400">
              ${char.real_name.charAt(0)}
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-bold text-white flex items-center gap-1.5 truncate">
                <span>${char.real_name}</span>
                <span class="text-[10px] text-gray-400">(${char.birth_year ? char.birth_year.split(' ')[0] : ''})</span>
              </div>
              <div class="text-[10px] text-pumpkin-400/90 truncate">${char.character_name} · ${char.role_title}</div>
            </div>
          </div>
          <div class="shrink-0 whitespace-nowrap">
            <span class="text-[10px] px-2.5 py-1 rounded-full bg-gothic-800 border border-gray-700 text-pumpkin-400 font-semibold whitespace-nowrap block">
              선택
            </span>
          </div>
        `;
        container.appendChild(btn);
      });

      document.getElementById('role-select-modal').classList.remove('hidden');
    }

    let tempSelectedRole = null;
    function selectTempRole(charId) {
      tempSelectedRole = charId;
      document.querySelectorAll('#modal-player-list > div').forEach(el => {
        el.className = el.className.replace('bg-pumpkin-500/20 border-pumpkin-500 text-white', 'bg-gothic-900/60 border-gray-800 text-gray-300');
      });
      const selectedEl = document.getElementById(`modal-btn-${charId}`);
      if (selectedEl) {
        selectedEl.className = selectedEl.className.replace('bg-gothic-900/60 border-gray-800 text-gray-300', 'bg-pumpkin-500/20 border-pumpkin-500 text-white');
      }
    }

    function confirmRoleSelection() {
      if (!tempSelectedRole && !currentUser) {
        alert('역할을 선택해 주세요!');
        return;
      }
      if (tempSelectedRole) {
        currentUser = tempSelectedRole;
      }

      saveLocalStorage();
      document.getElementById('role-select-modal').classList.add('hidden');
      renderHeader();
      renderCurrentTab();

      // 역할 선택 완료 시 60분 타이머 자동 시작
      if (!isTimerRunning) {
        toggleTimer();
      }
    }

    function renderHeader() {
      if (!currentUser || !GAME_DATA) return;
      const char = GAME_DATA.characters.find(c => c.id === currentUser);
      if (char) {
        document.getElementById('current-user-badge').innerHTML = `
          <span class="text-pumpkin-400 font-bold">${char.real_name}</span> 
          <span class="text-gray-400 font-medium">(${char.role_title})</span>
        `;
      }
      updateClueBadgeCount();
      updateStageTabStyles();
    }

    function updateClueBadgeCount() {
      if (!GAME_DATA) return;
      let count = 0;
      if (currentStage >= 2) {
        count += 1; // 공통 부검 단서
        if (currentUser && userZoneInvestigations[currentUser]) {
          count += 1; // 1차 구역 수색 단서
        }
        if (currentStage >= 4 && currentUser && userInvestigations[currentUser]) {
          count += userInvestigations[currentUser].length; // 2차 인물 수색 단서
        }
      }
      const badge = document.getElementById('clue-badge-count');
      if (badge) badge.innerText = count.toString();
    }

    const STAGE_NAMES = [
      '0. 사건발생',
      '1. 참가자 소개',
      '2. 1차 구역수색',
      '3. 1차 중간투표',
      '4. 2차 심층수색',
      '5. 최종투표',
      '6. 진범공개'
    ];

    function updateStageTabStyles() {
      document.querySelectorAll('.stage-tab').forEach(tab => {
        const stageNum = parseInt(tab.dataset.stage, 10);
        const isUnlocked = stageNum <= unlockedStage;
        const isCurrent = stageNum === currentStage;

        if (!isUnlocked) {
          // 아직 열리지 않은 미래 단계: 스포일러 방지를 위해 잠금 표시
          tab.innerHTML = `<i class="fa-solid fa-lock text-[8px] mr-1"></i>${stageNum}단계 (잠김)`;
          tab.className = 'stage-tab px-2.5 py-1 rounded-full transition-all text-gray-500 opacity-30 cursor-not-allowed text-xs border border-transparent shrink-0';
        } else {
          tab.innerHTML = STAGE_NAMES[stageNum];
          if (isCurrent) {
            tab.className = 'stage-tab px-3 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40 text-xs shrink-0 shadow-sm';
          } else {
            tab.className = 'stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white bg-gothic-900/60 border border-gray-800 text-xs shrink-0';
          }
        }
      });
    }

    function changeStage(newStage) {
      if (newStage > unlockedStage) {
        showToast(`🔒 이전 단계를 먼저 완료해야 ${newStage}단계로 진행할 수 있습니다!`);
        return;
      }

      currentStage = newStage;
      if (newStage === 6) {
        isFinalRevealed = true;
      }
      saveLocalStorage();
      updateStageTabStyles();
      updateClueBadgeCount();
      
      // 상단 단계 클릭 시 해당 탭으로 즉시 화면 전환
      if (newStage === 0) {
        setTab('story');
      } else if (newStage === 1) {
        setTab('players');
      } else if (newStage === 2) {

                  <span class="text-xs font-mono font-bold ${remainingSuspectQuota > 0 ? 'text-amber-300 bg-amber-950/80 border-amber-500/50' : 'text-emerald-300 bg-emerald-950/80 border-emerald-500/50'} px-2.5 py-1 rounded-lg border">

            ${currentStage < 4 ? `

                </p>
                <button onclick="changeStage(3)" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-xs sm:text-sm transition-all shadow">
                  1차 중간 투표하러 가기 ➔
                </button>
              </div>
            ` : `
              <!-- UNLOCKED PHASE 2 SUSPECT CARDS -->
              <div class="p-3.5 bg-gothic-900/90 rounded-xl border border-gray-800 text-xs sm:text-sm text-gray-300 space-y-1 shadow-inner">
                <p class="text-white font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-circle-info text-pumpkin-400"></i>
                  <span>2차 심층 수사 규칙</span>
                </p>
                <p class="text-gray-300 leading-relaxed text-xs sm:text-sm">
                  1차 투표 결과를 바탕으로 가장 의심스러운 친구 <strong class="text-white">최대 2명</strong>을 지목해 비밀 소지품과 행적을 독점 수사하세요!
                </p>
              </div>

              <div class="grid grid-cols-1 gap-3">
                ${GAME_DATA.characters.filter(c => c.id !== currentUser).map(suspect => {
                  const isInvestigated = myInv.includes(suspect.id);
                  const targetClue = GAME_DATA.target_clues ? GAME_DATA.target_clues[suspect.id] : null;

                  if (isInvestigated && targetClue) {
                    return `
                      <div class="card-glass rounded-xl p-3.5 border-2 border-emerald-500/60 bg-emerald-950/20 shadow-md space-y-2.5">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-mono font-bold text-emerald-300 bg-emerald-900/90 px-2 py-0.5 rounded border border-emerald-500/50">

                          <span class="text-xs text-emerald-300 font-mono">독점 열람 가능</span>

                          <div class="text-sm sm:text-base font-bold text-gray-100">${targetClue.title}</div>
                        </div>

                          <i class="fa-solid fa-envelope-open-text"></i>
                          <span>독점 수사 보고서 전체 보기</span>
                        </button>
                      </div>
                    `;
                  } else {
                    const canInvestigate = remainingSuspectQuota > 0;
                    return `
                      <div class="card-glass rounded-xl p-3.5 border border-gray-800 hover:border-gray-700 transition-all space-y-2.5">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-mono text-gray-400 bg-gray-800 px-2 py-0.5 rounded border border-gray-700">
                              <i class="fa-solid fa-lock mr-1"></i>비공개
                            </span>
                            <span class="text-sm sm:text-base font-bold text-gray-200">${suspect.real_name} <span class="text-xs text-gray-400 font-normal">${suspect.character_name}</span></span>
                          </div>
                          <span class="text-xs text-gray-400 font-mono">${suspect.role_title}</span>
                        </div>
                        <div class="bg-black/40 p-2.5 rounded-lg border border-gray-850 text-xs sm:text-sm text-gray-400 flex items-center justify-between">

                        ${canInvestigate ? `
                          <button onclick="investigateSuspect('${suspect.id}')" class="w-full bg-pumpkin-600 hover:bg-pumpkin-500 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow">

                <button onclick="advanceToStage(5)" class="w-full bg-gradient-to-r from-amber-600 to-crimson-600 hover:from-amber-500 hover:to-crimson-500 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-crimson-900/40 flex items-center justify-center gap-2">
                  <i class="fa-solid fa-gavel"></i>
                  <span>2차 심층 수색 완료! 5. 최후 변론 & 최종 투표 진행하기 ➔</span>
                </button>
              </div>
            `}
          </div>
        `}
      `;
      container.appendChild(card);
    }

    function renderZoneBox(zoneId, colSpan, searchedZoneId) {
      const zone = GAME_DATA.floor_plan.zones.find(z => z.id === zoneId);
      if (!zone) return '';
      const isSearchedByMe = searchedZoneId === zoneId;
      const isQuotaUsed = !!searchedZoneId;

      let borderStyle = 'border-cyan-500/60 bg-cyan-950/40 hover:bg-cyan-900/50';
      let statusTag = '<span class="text-cyan-300">수색 가능</span><span class="text-cyan-400">터치 ➔</span>';

      if (isSearchedByMe) {
        borderStyle = 'border-2 border-emerald-500 bg-emerald-950/60 shadow-lg shadow-emerald-950/60';
        statusTag = '<span class="text-emerald-300 font-bold">수색 완료</span><span class="text-emerald-300 font-bold">열람 ➔</span>';
      } else if (isQuotaUsed) {
        borderStyle = 'border-gray-800 bg-gray-900/40 opacity-60';
        statusTag = '<span class="text-gray-500">미수색</span><span class="text-gray-500">🔒</span>';
      }

      const icon = zone.code === 'A-01' ? '💀' : zone.code === 'B-02' ? '🍸' : zone.code === 'C-03' ? '🌙' : zone.code === 'D-04' ? '🚪' : zone.code === 'E-05' ? '📸' : '🚻';

      return `
        <div onclick="clickZoneBox('${zoneId}')" class="${colSpan} p-2.5 rounded-xl border-2 ${borderStyle} cursor-pointer transition-all flex flex-col justify-between group shadow-md">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono font-bold ${isSearchedByMe ? 'text-emerald-300 bg-emerald-900/90' : 'text-cyan-300 bg-cyan-900/90'} px-1.5 py-0.5 rounded">${zone.code}</span>
            <span class="text-xs">${icon}</span>
          </div>
          <div class="my-2">
            <div class="text-sm font-bold text-white group-hover:text-cyan-300 transition-colors">${zone.name}</div>
            <div class="text-xs text-gray-300 mt-0.5 leading-snug">${zone.label}</div>
          </div>
          <div class="text-xs font-mono border-t border-cyan-500/30 pt-1 flex items-center justify-between">
            ${statusTag}
          </div>
        </div>
      `;
    }

    function clickZoneBox(zoneId) {
      if (!currentUser) {
        showToast('⚠️ 먼저 본인의 역할을 선택해주세요.');
        setTab('role');
        return;
      }
      const mySearched = userZoneInvestigations[currentUser];
      if (mySearched === zoneId) {
        openZoneClueModal(zoneId);
        return;
      }
      if (mySearched) {
        showToast('⚠️ 이미 1곳의 구역을 수색하셨습니다! 다른 방의 단서는 친구들과 대화로 알아내세요.');
        return;
      }
      selectZoneInvestigation(zoneId);
    }

    function selectZoneInvestigation(zoneId) {
      const zone = GAME_DATA.floor_plan.zones.find(z => z.id === zoneId);
      const zoneName = zone ? zone.name : '해당 구역';

      if (confirm(`[${zoneName}]을(를) 1차 현장 정밀 수색 구역으로 선택하시겠습니까?\n\n(1인당 1곳만 수색할 수 있으며, 선택 즉시 해당 구역의 환경 단서가 영구 해금됩니다)`)) {
        userZoneInvestigations[currentUser] = zoneId;
        saveLocalStorage();
        updateClueBadgeCount();
        renderCurrentTab();
        showToast(`🔍 [${zoneName}] 수색 완료! 단서를 확인하세요.`);
        setTimeout(() => {
          openZoneClueModal(zoneId);
        }, 200);
      }
    }

    function openZoneClueModal(zoneId) {
      if (!GAME_DATA || !GAME_DATA.zone_clues || !GAME_DATA.zone_clues[zoneId]) return;
      const clue = GAME_DATA.zone_clues[zoneId];
      document.getElementById('modal-clue-badge').innerText = clue.badge || '1차 현장 구역 단서';
      document.getElementById('modal-clue-location').innerText = `${clue.zone_name} | ${clue.location}`;
      document.getElementById('modal-clue-title').innerText = clue.title;
      document.getElementById('modal-clue-desc').innerText = clue.description;
      document.getElementById('clue-detail-modal').classList.remove('hidden');
    }

    function openCommonClueModal() {
      if (!GAME_DATA || !GAME_DATA.common_clue) return;
      const clue = GAME_DATA.common_clue;
      document.getElementById('modal-clue-badge').innerText = clue.badge || '공통 수사 단서';
      document.getElementById('modal-clue-location').innerText = clue.location;
      document.getElementById('modal-clue-title').innerText = clue.title;
      document.getElementById('modal-clue-desc').innerText = clue.description;
      document.getElementById('clue-detail-modal').classList.remove('hidden');
    }

    function openTargetClueModal(targetId) {
      if (!GAME_DATA || !GAME_DATA.target_clues || !GAME_DATA.target_clues[targetId]) return;
      const clue = GAME_DATA.target_clues[targetId];
      document.getElementById('modal-clue-badge').innerText = clue.badge || '비밀 수사 단서';
      document.getElementById('modal-clue-location').innerText = `${clue.target_name} | ${clue.location}`;
      document.getElementById('modal-clue-title').innerText = clue.title;
      document.getElementById('modal-clue-desc').innerText = clue.description;
      document.getElementById('clue-detail-modal').classList.remove('hidden');
    }

    function investigateSuspect(targetId) {
      if (!currentUser) {
        showToast('⚠️ 먼저 역할을 선택해주세요.');
        setTab('role');
        return;
      }
      if (!userInvestigations[currentUser]) {
        userInvestigations[currentUser] = [];
      }
      if (userInvestigations[currentUser].includes(targetId)) {
        openTargetClueModal(targetId);
        return;
      }
      if (userInvestigations[currentUser].length >= 2) {
        showToast('⚠️ 수사 기회(최대 2명)를 이미 모두 사용했습니다!');
        return;
      }

      const targetChar = GAME_DATA.characters.find(c => c.id === targetId);
      const targetName = targetChar ? `${targetChar.real_name} (${targetChar.character_name})` : '용의자';

      if (confirm(`[${targetName}]을(를) 수사 대상 2인 중 1명으로 지목하시겠습니까?\n\n(지목 즉시 비밀 단서가 독점 해금되며, 취소할 수 없습니다)`)) {
        userInvestigations[currentUser].push(targetId);
        saveLocalStorage();
        updateClueBadgeCount();
        renderCurrentTab();
        showToast(`🔍 ${targetName}의 비밀 단서를 확보했습니다!`);
        setTimeout(() => {
          openTargetClueModal(targetId);
        }, 200);
      }
    }

    function openClueModal(clueId) {
      if (clueId === 'common' || clueId === 'common_clue') {
        openCommonClueModal();
        return;
      }
      if (GAME_DATA && GAME_DATA.zone_clues && GAME_DATA.zone_clues[clueId]) {
        openZoneClueModal(clueId);
        return;
      }
      if (GAME_DATA && GAME_DATA.target_clues && GAME_DATA.target_clues[clueId]) {
        openTargetClueModal(clueId);
        return;
      }
      openCommonClueModal();
    }

    function closeClueModal() {
      document.getElementById('clue-detail-modal').classList.add('hidden');
    }

    function renderVoteTab(container) {

    // 60-Minute Countdown Timer
    function toggleTimer() {
      const timerIcon = document.getElementById('timer-icon');
      const timerDisplay = document.getElementById('timer-display');

      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if (timerIcon) timerIcon.innerText = '▶';
        if (timerDisplay) timerDisplay.classList.remove('text-crimson-400', 'animate-pulse');
      } else {
        isTimerRunning = true;
        if (timerIcon) timerIcon.innerText = '⏸';
        if (timerDisplay) timerDisplay.classList.add('text-crimson-400', 'animate-pulse');
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            if (timerIcon) timerIcon.innerText = '▶';
            alert('⏰ 60분이 종료되었습니다! 최종 투표를 진행하세요!');
          }
        }, 1000);
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Audio / BGM Synthesizer (Spooky Ambient Synth using Web Audio API)
    let spookyInterval = null;
    async function toggleAudio() {
      const icon = document.getElementById('bgm-icon');

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (isAudioPlaying) {
          stopSpookyMusic();
          isAudioPlaying = false;
          if (icon) icon.className = 'fa-solid fa-volume-xmark text-gray-400';
          showToast('🔇 BGM 음소거');
        } else {
          startSpookyMusic();
          isAudioPlaying = true;
          if (icon) icon.className = 'fa-solid fa-volume-high text-pumpkin-400 animate-pulse';
          showToast('🔊 할로윈 테마 BGM 재생');
        }
      } catch (err) {
        console.error('Audio playback error:', err);
        showToast('⚠️ 오디오 재생 권한을 확인해주세요');
      }
    }

    function startSpookyMusic() {
      stopSpookyMusic();
      playChimeChord();
      spookyInterval = setInterval(() => {
        if (isAudioPlaying) playChimeChord();
      }, 4500);
    }

    function stopSpookyMusic() {
      if (spookyInterval) {
        clearInterval(spookyInterval);
        spookyInterval = null;
      }
    }

    function playChimeChord() {
      if (!audioCtx) return;
      // D minor pentatonic spooky arpeggio notes (D4, F4, A4, C5)
      const freqs = [293.66, 349.23, 440.0, 523.25];
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.25);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + idx * 0.25 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.25 + 1.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + idx * 0.25);
        osc.stop(audioCtx.currentTime + idx * 0.25 + 1.9);
      });
    }

    // ==========================================
    // ENDING AWARDS & COPY SUMMARY
    // ==========================================
    function copyEndingAwards() {
      if (!GAME_DATA) return;
      const finalVoteCounts = {};
      GAME_DATA.characters.forEach(c => { finalVoteCounts[c.id] = 0; });
      Object.values(votes).forEach(targetId => {
        if (finalVoteCounts[targetId] !== undefined) finalVoteCounts[targetId]++;
      });

      const sherlockVoters = Object.entries(votes)
        .filter(([voterId, targetId]) => targetId === 'char_jiyoung')
        .map(([voterId]) => {
          const c = GAME_DATA.characters.find(char => char.id === voterId);
          return c ? c.real_name : voterId;
        });

      const culpritVotes = finalVoteCounts['char_jiyoung'] || 0;
      let oscarText = '';
      if (culpritVotes <= 2) {
        oscarText = `문지영 (단 ${culpritVotes}표로 포커페이스 성공)`;
      } else {
        const topInnocent = [...GAME_DATA.characters]
          .filter(c => c.id !== 'char_jiyoung')
          .sort((a, b) => (finalVoteCounts[b.id] || 0) - (finalVoteCounts[a.id] || 0))[0];
        oscarText = topInnocent ? `${topInnocent.real_name} (${finalVoteCounts[topInnocent.id] || 0}표 획득, 최고의 방패)` : '문지영';
      }

      const scapegoatCandidates = [...GAME_DATA.characters]
        .filter(c => c.id !== 'char_jiyoung')
        .sort((a, b) => (finalVoteCounts[b.id] || 0) - (finalVoteCounts[a.id] || 0));
      const scapegoat = scapegoatCandidates[0];
      const scapegoatVotes = scapegoat ? (finalVoteCounts[scapegoat.id] || 0) : 0;
      const scapegoatText = scapegoatVotes > 0 ? `${scapegoat.real_name} (${scapegoatVotes}표 획득)` : '없음';

      const copyText = `🎃 [붉은 호박의 밤: 8인의 할로윈 미스터리 - 최종 결과] 🎃

⚖️ 최종 집계:
- 진범: 문지영 (전 약혼녀 / 바텐더)
- 진범 득표수: ${culpritVotes}표

🏆 할로윈 파티 명예의 전당:
🕵️ [명탐정 셜록상]: ${sherlockVoters.length > 0 ? sherlockVoters.join(', ') : '검거 실패'}
🎭 [오스카 명연기상]: ${oscarText}
🕳️ [희대의 삽질상]: ${scapegoatText}

함께 즐겨주셔서 감사합니다! 🍷🎃`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(() => {
          showToast('📋 단톡방 공유용 결과 텍스트가 복사되었습니다!');
        }).catch(() => {
          fallbackCopyText(copyText);
        });
      } else {
        fallbackCopyText(copyText);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('📋 결과가 클립보드에 복사되었습니다!');
      } catch (err) {
        prompt('아래 텍스트를 복사하세요:', text);
      }
      document.body.removeChild(ta);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
