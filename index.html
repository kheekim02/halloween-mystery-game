<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>할로윈 파티룸: 붉은 호박의 밤 | 머더 미스터리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pumpkin: {
              400: '#ff9233',
              500: '#ff7300',
              600: '#e65c00'
            },
            crimson: {
              500: '#e63946',
              600: '#c52233',
              700: '#9b111e'
            },
            gothic: {
              900: '#0d0b14',
              800: '#171424',
              700: '#231e36',
              600: '#322b4d'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0b14;
      color: #f3f4f6;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #171424;
    }
    ::-webkit-scrollbar-thumb {
      background: #322b4d;
      border-radius: 3px;
    }
    .neon-glow-orange {
      text-shadow: 0 0 10px rgba(255, 115, 0, 0.6), 0 0 20px rgba(255, 115, 0, 0.3);
    }
    .neon-glow-red {
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.7), 0 0 25px rgba(230, 57, 70, 0.4);
    }
    .card-glass {
      background: rgba(23, 20, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 115, 0, 0.2);
    }
    .card-glass-red {
      background: rgba(23, 20, 36, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 57, 70, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 selection:bg-pumpkin-500 selection:text-white">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-50 bg-gothic-900/95 backdrop-blur-md border-b border-pumpkin-500/20 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2.5">
      <span class="text-2xl animate-pulse">🎃</span>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white">
          <span>붉은 호박의 밤</span>
        </h1>
        <p class="text-xs text-gray-300 font-medium" id="current-user-badge">플레이어를 선택하세요</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 60m TIMER BADGE -->
      <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex items-center space-x-1.5 bg-gothic-800 border border-pumpkin-500/40 hover:border-pumpkin-500 px-3 py-1.5 rounded-full text-xs font-mono text-pumpkin-400 shadow-inner group transition-all" title="클릭하여 타이머 시작/일시정지">
        <span id="timer-icon" class="text-xs text-pumpkin-500">▶</span>
        <span id="timer-display" class="font-bold text-xs">60:00</span>
      </button>

      <!-- BGM SOUND TOGGLE -->
      <button onclick="toggleAudio()" id="bgm-btn" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs">
        <i class="fa-solid fa-volume-xmark" id="bgm-icon"></i>
      </button>

      <!-- SWITCH ROLE -->
      <button onclick="openSelectRoleModal()" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white text-xs" title="내 역할 변경">
        <i class="fa-solid fa-user-gear"></i>
      </button>
    </div>
  </header>

  <!-- STAGE PROGRESS BAR -->
  <div class="bg-gothic-800/90 px-3 py-2 border-b border-gray-800 flex items-center gap-2 overflow-x-auto text-xs no-scrollbar">
    <div class="flex items-center gap-1 text-xs text-gray-400 font-bold shrink-0 pl-1">
      <i class="fa-solid fa-flag-checkered text-pumpkin-500"></i>
      <span>진행:</span>
    </div>
    <div class="flex items-center space-x-1.5 min-w-max" id="stage-tabs-container">
      <button onclick="changeStage(0)" class="stage-tab px-3 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40 text-xs" data-stage="0">0. 사건발생</button>
      <button onclick="changeStage(1)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="1">1. 참가자&코스튬</button>
      <button onclick="changeStage(2)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="2">2. 1차 단서수색</button>
      <button onclick="changeStage(3)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="3">3. 2차 심층수색</button>
      <button onclick="changeStage(4)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="4">4. 비밀투표</button>
      <button onclick="changeStage(5)" class="stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs" data-stage="5">5. 진범공개</button>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4" id="app-viewport">
    <!-- Dynamic views injected here by app.js -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-gothic-900/95 backdrop-blur-lg border-t border-gray-800 max-w-xl mx-auto px-4 py-2 flex items-center justify-around shadow-2xl">
    <button onclick="setTab('role')" id="nav-btn-role" class="nav-btn flex flex-col items-center justify-center text-pumpkin-400">
      <i class="fa-solid fa-id-card-clip text-lg mb-0.5"></i>
      <span class="text-xs font-bold">내 비밀역할</span>
    </button>
    <button onclick="setTab('story')" id="nav-btn-story" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-book-skull text-lg mb-0.5"></i>
      <span class="text-xs font-bold">사건현장</span>
    </button>
    <button onclick="setTab('clues')" id="nav-btn-clues" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200 relative">
      <i class="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
      <span class="text-xs font-bold">단서보관소</span>
      <span id="clue-badge-count" class="absolute -top-1 -right-2 bg-crimson-600 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>
    <button onclick="setTab('players')" id="nav-btn-players" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-masks-theater text-lg mb-0.5"></i>
      <span class="text-xs font-bold">용의자7인</span>
    </button>
    <button onclick="setTab('vote')" id="nav-btn-vote" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-gray-200">
      <i class="fa-solid fa-check-to-slot text-lg mb-0.5"></i>
      <span class="text-xs font-bold">지목투표</span>
    </button>
  </nav>

  <!-- ROLE SELECT MODAL (LOGIN) -->
  <div id="role-select-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass rounded-2xl max-w-md w-full p-5 border border-pumpkin-500/40 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="text-center space-y-1">
        <div class="inline-block p-3 rounded-full bg-pumpkin-500/10 border border-pumpkin-500/30 text-pumpkin-400 text-2xl mb-1 animate-bounce">
          🎃
        </div>
        <h2 class="text-lg font-bold text-white tracking-tight">당신의 이름을 선택하세요</h2>
        <p class="text-xs text-gray-400">배정된 역할지에는 극비 미션과 비밀이 담겨 있습니다.</p>
      </div>

      <!-- PLAYER LIST -->
      <div class="space-y-2" id="modal-player-list">
        <!-- Rendered by JS -->
      </div>

      <!-- COSTUME INPUT -->
      <div class="pt-2 border-t border-gray-800 space-y-2">
        <label class="block text-xs font-semibold text-pumpkin-400 flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>오늘 입고 온 할로윈 코스튬은?</span>
        </label>
        <input type="text" id="input-costume" placeholder="예: 스파이더맨, 해리포터, 삐에로, 공룡잠옷..." 
               class="w-full bg-gothic-900 border border-gray-700 focus:border-pumpkin-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 outline-none transition-all">
        <p class="text-[10px] text-gray-400">입력한 코스튬은 다른 친구들의 프로필과 단서에 실시간 반영됩니다.</p>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="confirmRoleSelection()" class="flex-1 bg-gradient-to-r from-pumpkin-600 to-pumpkin-500 hover:from-pumpkin-500 hover:to-pumpkin-400 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-pumpkin-500/20">
          내 역할 확인하고 시작하기
        </button>
      </div>
    </div>
  </div>

  <!-- CLUE DETAIL MODAL -->
  <div id="clue-detail-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="card-glass-red rounded-2xl max-w-md w-full p-5 border border-crimson-500/60 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <!-- Modal Header -->
      <div class="flex items-start justify-between border-b border-gray-800 pb-3">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-xs font-mono font-bold text-pumpkin-400 bg-pumpkin-500/20 px-2.5 py-0.5 rounded-full border border-pumpkin-500/30" id="modal-clue-badge">증거물</span>
            <span class="text-xs font-mono text-gray-300" id="modal-clue-location">장소</span>
          </div>
          <h3 class="text-xl font-bold text-white tracking-tight" id="modal-clue-title">단서 명</h3>
        </div>
        <button onclick="closeClueModal()" class="w-8 h-8 rounded-full bg-gothic-800 border border-gray-700 flex items-center justify-center text-gray-300 hover:text-white text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Clear HTML Text Panel -->
      <div class="p-4 bg-gothic-900/90 rounded-xl border border-gray-800 space-y-2.5 shadow-inner">
        <div class="flex items-center justify-between text-xs font-bold text-gray-400 border-b border-gray-800 pb-1.5">
          <span class="flex items-center gap-1.5 text-pumpkin-400">
            <i class="fa-solid fa-file-shield"></i>
            <span>현장 수사 분석 보고서</span>
          </span>
          <span class="text-emerald-400 font-mono">STATUS: CONFIRMED</span>
        </div>
        <p class="text-sm text-gray-100 leading-relaxed whitespace-pre-line font-medium pt-1" id="modal-clue-desc"></p>
      </div>

      <button onclick="closeClueModal()" class="w-full bg-gothic-800 hover:bg-gothic-700 text-white font-bold py-3 rounded-xl text-sm transition-all border border-gray-700 shadow-md">
        확인 완료 (닫기)
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Global State
    let GAME_DATA = null;
    let currentUser = null; // Character ID
    let currentTab = 'role'; // 'role', 'story', 'clues', 'players', 'vote'
    let currentStage = 0; // 0 to 5
    let userCostumes = {}; // { char_id: '드라큘라' }
    let votes = {}; // { voter_id: target_id }
    let userInvestigations = {}; // { [charId]: ['target1', 'target2'] }
    let timerSeconds = 3600; // 60 minutes
    let timerInterval = null;
    let isTimerRunning = false;
    let audioCtx = null;
    let isAudioPlaying = false;

    // Load Scenario Data
    async function initApp() {
      try {
        const response = await fetch('scenario.json');
        GAME_DATA = await response.json();
        
        // Restore local storage if exists
        loadLocalStorage();

        // Render initial UI
        renderHeader();
        if (!currentUser) {
          openSelectRoleModal();
        } else {
          renderCurrentTab();
        }
      } catch (err) {
        console.error('Failed to load scenario data:', err);
      }
    }

    function loadLocalStorage() {
      const savedUser = localStorage.getItem('mystery_user');
      if (savedUser) currentUser = savedUser;

      const savedCostumes = localStorage.getItem('mystery_costumes');
      if (savedCostumes) userCostumes = JSON.parse(savedCostumes);

      const savedStage = localStorage.getItem('mystery_stage');
      if (savedStage !== null) currentStage = parseInt(savedStage, 10);

      const savedVotes = localStorage.getItem('mystery_votes');
      if (savedVotes) votes = JSON.parse(savedVotes);

      const savedInv = localStorage.getItem('mystery_investigations');
      if (savedInv) userInvestigations = JSON.parse(savedInv);
    }

    function saveLocalStorage() {
      if (currentUser) localStorage.setItem('mystery_user', currentUser);
      localStorage.setItem('mystery_costumes', JSON.stringify(userCostumes));
      localStorage.setItem('mystery_stage', currentStage.toString());
      localStorage.setItem('mystery_votes', JSON.stringify(votes));
      localStorage.setItem('mystery_investigations', JSON.stringify(userInvestigations));
    }

    // Role Selection Modal
    function openSelectRoleModal() {
      const container = document.getElementById('modal-player-list');
      container.innerHTML = '';

      GAME_DATA.characters.forEach(char => {
        const isSelected = currentUser === char.id;
        const costume = userCostumes[char.id] || '코스튬 미입력';

        const btn = document.createElement('div');
        btn.className = `p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${
          isSelected 
            ? 'bg-pumpkin-500/20 border-pumpkin-500 text-white' 
            : 'bg-gothic-900/60 border-gray-800 text-gray-300 hover:border-gray-700'
        }`;
        btn.onclick = () => selectTempRole(char.id);
        btn.id = `modal-btn-${char.id}`;

        btn.innerHTML = `
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-full bg-gothic-800 border border-pumpkin-500/30 flex items-center justify-center text-xs font-bold text-pumpkin-400">
              ${char.real_name.charAt(0)}
            </div>
            <div>
              <div class="text-xs font-bold text-white flex items-center gap-1.5">
                <span>${char.real_name}</span>
                <span class="text-[10px] text-gray-400">(${char.birth_year})</span>
              </div>
              <div class="text-[10px] text-pumpkin-400/90">${char.character_name} · ${char.role_title}</div>
            </div>
          </div>
          <div class="text-right">
            <span class="text-[9px] px-2 py-0.5 rounded-full bg-gothic-800 border border-gray-700 text-gray-300">
              🎭 ${costume}
            </span>
          </div>
        `;
        container.appendChild(btn);
      });

      if (currentUser && userCostumes[currentUser]) {
        document.getElementById('input-costume').value = userCostumes[currentUser];
      }

      document.getElementById('role-select-modal').classList.remove('hidden');
    }

    let tempSelectedRole = null;
    function selectTempRole(charId) {
      tempSelectedRole = charId;
      document.querySelectorAll('#modal-player-list > div').forEach(el => {
        el.className = el.className.replace('bg-pumpkin-500/20 border-pumpkin-500 text-white', 'bg-gothic-900/60 border-gray-800 text-gray-300');
      });
      const selectedEl = document.getElementById(`modal-btn-${charId}`);
      if (selectedEl) {
        selectedEl.className = selectedEl.className.replace('bg-gothic-900/60 border-gray-800 text-gray-300', 'bg-pumpkin-500/20 border-pumpkin-500 text-white');
      }
      if (userCostumes[charId]) {
        document.getElementById('input-costume').value = userCostumes[charId];
      }
    }

    function confirmRoleSelection() {
      if (!tempSelectedRole && !currentUser) {
        alert('역할을 선택해 주세요!');
        return;
      }
      if (tempSelectedRole) {
        currentUser = tempSelectedRole;
      }

      const costumeInput = document.getElementById('input-costume').value.trim();
      if (costumeInput) {
        userCostumes[currentUser] = costumeInput;
      } else if (!userCostumes[currentUser]) {
        userCostumes[currentUser] = '할로윈 분장';
      }

      saveLocalStorage();
      document.getElementById('role-select-modal').classList.add('hidden');
      renderHeader();
      renderCurrentTab();

      // 역할 선택 완료 시 60분 타이머 자동 시작
      if (!isTimerRunning) {
        toggleTimer();
      }
    }

    function renderHeader() {
      if (!currentUser || !GAME_DATA) return;
      const char = GAME_DATA.characters.find(c => c.id === currentUser);
      if (char) {
        const costume = userCostumes[char.id] ? `(${userCostumes[char.id]})` : '';
        document.getElementById('current-user-badge').innerHTML = `
          <span class="text-pumpkin-400 font-bold">${char.real_name}</span> 
          <span class="text-gray-400">${char.character_name.split(' ')[1] || ''} ${costume}</span>
        `;
      }
      updateClueBadgeCount();
      updateStageTabStyles();
    }

    function updateClueBadgeCount() {
      if (!GAME_DATA) return;
      let count = 0;
      if (currentStage >= 2) {
        count += 1; // 공통 단서 (전원 기본 해금)
        if (currentUser && userInvestigations[currentUser]) {
          count += userInvestigations[currentUser].length;
        }
      }
      const badge = document.getElementById('clue-badge-count');
      if (badge) badge.innerText = count.toString();
    }

    function updateStageTabStyles() {
      document.querySelectorAll('.stage-tab').forEach(tab => {
        const stageNum = parseInt(tab.dataset.stage, 10);
        if (stageNum === currentStage) {
          tab.className = 'stage-tab px-3 py-1 rounded-full transition-all text-pumpkin-400 font-bold bg-pumpkin-500/20 border border-pumpkin-500/40 text-xs';
        } else {
          tab.className = 'stage-tab px-3 py-1 rounded-full transition-all text-gray-300 hover:text-white text-xs';
        }
      });
    }

    function changeStage(newStage) {
      currentStage = newStage;
      saveLocalStorage();
      updateStageTabStyles();
      updateClueBadgeCount();
      
      // 상단 단계 클릭 시 해당 진행 단계 탭으로 즉시 화면 전환
      if (newStage === 0) {
        setTab('story');
      } else if (newStage === 1) {
        setTab('players');
      } else if (newStage === 2 || newStage === 3) {
        setTab('clues');
      } else if (newStage === 4 || newStage === 5) {
        setTab('vote');
      } else {
        renderCurrentTab();
      }
    }

    function setTab(tabName) {
      currentTab = tabName;
      // Update nav buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn flex flex-col items-center justify-center text-gray-500 hover:text-gray-300';
      });
      const activeBtn = document.getElementById(`nav-btn-${tabName}`);
      if (activeBtn) {
        activeBtn.className = 'nav-btn flex flex-col items-center justify-center text-pumpkin-400';
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('app-viewport');
      container.innerHTML = '';

      switch (currentTab) {
        case 'role':
          renderRoleTab(container);
          break;
        case 'story':
          renderStoryTab(container);
          break;
        case 'clues':
          renderCluesTab(container);
          break;
        case 'players':
          renderPlayersTab(container);
          break;
        case 'vote':
          renderVoteTab(container);
          break;
      }
    }

    // 1. ROLE TAB
    function renderRoleTab(container) {
      if (!currentUser) return;
      const char = GAME_DATA.characters.find(c => c.id === currentUser);
      const costume = userCostumes[char.id] || '자유 코스튬';

      const isCulprit = char.is_culprit;

      const card = document.createElement('div');
      card.className = 'space-y-4';
      card.innerHTML = `
        <!-- TOP ID CARD -->
        <div class="card-glass rounded-2xl p-4 border ${isCulprit ? 'border-crimson-500/50 shadow-crimson-600/20' : 'border-pumpkin-500/30'} shadow-xl relative overflow-hidden">
          ${isCulprit ? `
            <div class="absolute -right-12 top-4 bg-crimson-600 text-white text-[10px] font-extrabold uppercase px-12 py-1 rotate-45 shadow">
              진범 (CULPRIT)
            </div>
          ` : ''}

          <div class="flex items-center space-x-3 mb-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-pumpkin-500 to-crimson-600 flex items-center justify-center text-xl font-bold text-white shadow-lg">
              ${char.real_name.charAt(0)}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-base font-bold text-white tracking-tight">${char.real_name}</h2>
                <span class="text-xs text-gray-400">${char.birth_year}</span>
              </div>
              <p class="text-xs font-semibold text-pumpkin-400">${char.character_name} · ${char.role_title}</p>
            </div>
          </div>

          <div class="bg-gothic-900/80 rounded-xl p-3 border border-gray-800 space-y-1.5 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-gray-400">오늘의 코스튬:</span>
              <span class="text-white font-bold bg-pumpkin-500/20 px-2 py-0.5 rounded border border-pumpkin-500/30">
                🎭 ${costume}
              </span>
            </div>

                            </span>
                            <span class="text-sm sm:text-base font-bold text-gray-200">${suspect.real_name} <span class="text-xs text-gray-400 font-normal">${suspect.character_name} ${costume}</span></span>
                          </div>
                          <span class="text-xs text-gray-400 font-mono">${suspect.role_title}</span>
                        </div>
                        <div class="bg-black/40 p-2.5 rounded-lg border border-gray-850 text-xs sm:text-sm text-gray-400 flex items-center justify-between">
                          <span>${suspect.real_name}의 비밀 소지품 및 행적 단서</span>
                          <span class="text-gray-400 font-mono">🔒 잠김</span>
                        </div>
                        ${canInvestigate ? `
                          <button onclick="investigateSuspect('${suspect.id}')" class="w-full bg-cyan-700 hover:bg-cyan-600 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>이 사람 수사하기 (기회 1회 소진)</span>
                          </button>
                        ` : `
                          <button disabled class="w-full bg-gray-800/80 text-gray-400 font-semibold py-2.5 rounded-lg text-xs sm:text-sm cursor-not-allowed">
                            수사 기회(2회) 소진됨 (지목 불가)
                          </button>
                        `}
                      </div>
                    `;
                  }
                }).join('')}
              </div>

              <!-- RESET BUTTON (FOR TESTING) -->
              <div class="text-center pt-2">
                <button onclick="resetInvestigations()" class="text-xs text-gray-400 hover:text-gray-200 underline font-mono">
                  [테스트용] 나의 수사 지목 내역 초기화
                </button>
              </div>
            `}
          </div>
        `}
      `;
      container.appendChild(card);
    }

    function openCommonClueModal() {
      if (!GAME_DATA || !GAME_DATA.common_clue) return;
      const clue = GAME_DATA.common_clue;
      document.getElementById('modal-clue-badge').innerText = clue.badge || '공통 수사 단서';
      document.getElementById('modal-clue-location').innerText = clue.location;
      document.getElementById('modal-clue-title').innerText = clue.title;
      document.getElementById('modal-clue-desc').innerText = clue.description;
      document.getElementById('clue-detail-modal').classList.remove('hidden');
    }

    function openTargetClueModal(targetId) {
      if (!GAME_DATA || !GAME_DATA.target_clues || !GAME_DATA.target_clues[targetId]) return;
      const clue = GAME_DATA.target_clues[targetId];
      document.getElementById('modal-clue-badge').innerText = clue.badge || '비밀 수사 단서';
      document.getElementById('modal-clue-location').innerText = `${clue.target_name} | ${clue.location}`;
      document.getElementById('modal-clue-title').innerText = clue.title;
      document.getElementById('modal-clue-desc').innerText = clue.description;
      document.getElementById('clue-detail-modal').classList.remove('hidden');
    }

    function investigateSuspect(targetId) {
      if (!currentUser) {
        showToast('⚠️ 먼저 역할을 선택해주세요.');
        setTab('role');
        return;
      }
      if (!userInvestigations[currentUser]) {
        userInvestigations[currentUser] = [];
      }
      if (userInvestigations[currentUser].includes(targetId)) {
        openTargetClueModal(targetId);
        return;
      }
      if (userInvestigations[currentUser].length >= 2) {
        showToast('⚠️ 수사 기회(최대 2명)를 이미 모두 사용했습니다!');
        return;
      }

      const targetChar = GAME_DATA.characters.find(c => c.id === targetId);
      const targetName = targetChar ? `${targetChar.real_name} (${targetChar.character_name})` : '용의자';

      if (confirm(`[${targetName}]을(를) 수사 대상 2인 중 1명으로 지목하시겠습니까?\n\n(지목 즉시 비밀 단서가 독점 해금되며, 취소할 수 없습니다)`)) {
        userInvestigations[currentUser].push(targetId);
        saveLocalStorage();
        updateClueBadgeCount();
        renderCurrentTab();
        showToast(`🔍 ${targetName}의 비밀 단서를 확보했습니다!`);
        setTimeout(() => {
          openTargetClueModal(targetId);
        }, 200);
      }
    }

    function resetInvestigations() {
      if (!currentUser) return;
      if (confirm('수사 지목 내역을 초기화하시겠습니까? (테스트용)')) {
        userInvestigations[currentUser] = [];
        saveLocalStorage();
        updateClueBadgeCount();
        renderCurrentTab();
        showToast('수사 지목 내역이 초기화되었습니다.');
      }
    }

    function openClueModal(clueId) {
      if (clueId === 'common' || clueId === 'common_clue') {
        openCommonClueModal();
        return;
      }
      if (GAME_DATA && GAME_DATA.target_clues && GAME_DATA.target_clues[clueId]) {
        openTargetClueModal(clueId);
        return;
      }
      openCommonClueModal();
    }

    function closeClueModal() {
      document.getElementById('clue-detail-modal').classList.add('hidden');
    }

    // 4. PLAYERS TAB
    function renderPlayersTab(container) {
      const card = document.createElement('div');
      card.className = 'space-y-3';

      card.innerHTML = `
        <div class="flex items-center justify-between">

            <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
              <i class="fa-solid fa-masks-theater text-pumpkin-500"></i>
              <span>용의자 7인 프로필 & 코스튬</span>
            </h3>
            <p class="text-[10px] text-gray-400">서로의 표정과 알리바이를 관찰하세요.</p>
          </div>
          <button onclick="openSelectRoleModal()" class="text-[10px] text-pumpkin-400 border border-pumpkin-500/30 px-2 py-0.5 rounded-full hover:bg-pumpkin-500/10">
            코스튬 수정
          </button>
        </div>

        <div class="space-y-2.5">
          ${GAME_DATA.characters.map(char => {
            const isMe = char.id === currentUser;
            const costume = userCostumes[char.id] || '코스튬 미입력';

            return `
              <div class="card-glass rounded-2xl p-3.5 border ${isMe ? 'border-pumpkin-500 shadow-md shadow-pumpkin-500/10' : 'border-gray-800'} space-y-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl ${isMe ? 'bg-pumpkin-500 text-white' : 'bg-gothic-900 border border-gray-700 text-gray-300'} flex items-center justify-center text-xs font-bold">
                      ${char.real_name.charAt(0)}
                    </div>
                    <div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-bold text-white">${char.real_name}</span>
                        <span class="text-[10px] text-gray-400">${char.birth_year}</span>
                        ${isMe ? '<span class="text-[9px] bg-pumpkin-500/20 text-pumpkin-400 font-bold px-1.5 py-0.2 rounded border border-pumpkin-500/30">나</span>' : ''}
                      </div>
                      <p class="text-[10px] text-pumpkin-400/90 font-medium">${char.character_name} · ${char.role_title}</p>
                    </div>
                  </div>

                  <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-gothic-900 border border-pumpkin-500/30 text-pumpkin-300 shadow-inner">
                    🎭 ${costume}
                  </span>
                </div>

                <div class="text-[11px] text-gray-300 bg-gothic-900/60 p-2.5 rounded-xl border border-gray-800/80 space-y-1">
                  <div><strong class="text-gray-400">공개 신분:</strong> ${char.public_info}</div>
                  <div><strong class="text-gray-400">공개 알리바이:</strong> "${char.alibi}"</div>
                </div>
              </div>

        </div>
      `;
      container.appendChild(card);
    }

    // 5. VOTE & EPILOGUE TAB
    function renderVoteTab(container) {
      const card = document.createElement('div');
      card.className = 'space-y-4';

      const myVote = votes[currentUser] || null;

      card.innerHTML = `
        <div class="card-glass rounded-2xl p-4 border border-pumpkin-500/40 text-center space-y-2">
          <div class="text-3xl text-pumpkin-500">🗳️</div>
          <h3 class="text-sm font-bold text-white">최종 범인 비밀 투표</h3>
          <p class="text-xs text-gray-300">
            모든 단서와 알리바이를 종합하여, 박서준을 독살한 <strong class="text-crimson-400">진범 1명</strong>을 지목하세요.
          </p>
        </div>

        <!-- CANDIDATES -->
        <div class="space-y-2">
          ${GAME_DATA.characters.map(char => {
            const isMe = char.id === currentUser;
            const isSelected = myVote === char.id;
            const costume = userCostumes[char.id] || '코스튬';

            return `
              <div onclick="submitVote('${char.id}')" 
                   class="card-glass rounded-xl p-3 border transition-all cursor-pointer flex items-center justify-between ${

                       : 'border-gray-800 hover:border-gray-700'
                   }">
                <div class="flex items-center space-x-3">
                  <div class="w-8 h-8 rounded-lg ${isSelected ? 'bg-crimson-600 text-white' : 'bg-gothic-900 text-gray-400'} flex items-center justify-center text-xs font-bold">
                    ${isSelected ? '✓' : char.real_name.charAt(0)}
                  </div>
                  <div>
                    <div class="text-xs font-bold text-white flex items-center gap-1.5">
                      <span>${char.real_name}</span>
                      <span class="text-[10px] text-gray-400">(${costume})</span>
                      ${isMe ? '<span class="text-[9px] text-gray-500">(나)</span>' : ''}
                    </div>
                    <p class="text-[10px] text-pumpkin-400/90">${char.character_name}</p>
                  </div>
                </div>
                <div>
                  ${isSelected ? `
                    <span class="text-[10px] font-bold text-crimson-400 bg-crimson-900/40 px-2 py-0.5 rounded border border-crimson-500/50">
                      내 지목 대상
                    </span>
                  ` : `
                    <span class="text-[10px] text-gray-500 group-hover:text-gray-300">지목하기</span>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- STAGE 5 EPILOGUE (진범 공개 버튼) -->
        <div class="pt-4 border-t border-gray-800">
          ${currentStage >= 5 ? `
            <div class="card-glass-red rounded-2xl p-4 border border-crimson-500 space-y-3 shadow-2xl animate-fade-in">
              <div class="flex items-center space-x-2 text-crimson-400 font-bold text-sm">
                <i class="fa-solid fa-skull"></i>
                <span>[진범 공개] 사건의 전말 해설</span>
              </div>

              <div class="p-3 bg-black/60 rounded-xl border border-crimson-500/30 space-y-2 text-xs">
                <div class="text-pumpkin-400 font-bold text-sm">
                  진범: ${GAME_DATA.epilogue.culprit_name}
                </div>
                <p class="text-gray-200 leading-relaxed whitespace-pre-line">
${GAME_DATA.epilogue.full_truth}
                </p>
              </div>

              <div class="p-3 bg-gothic-900/90 rounded-xl border border-gray-800 space-y-1 text-xs">
                <div class="text-white font-bold text-[11px] flex items-center gap-1">
                  <i class="fa-solid fa-clapperboard text-pumpkin-500"></i>
                  <span>사건 이후 비하인드 스토리</span>
                </div>
                <p class="text-gray-300 text-[11px] leading-relaxed">
                  ${GAME_DATA.epilogue.after_story}
                </p>
              </div>
            </div>
          ` : `
            <div class="text-center space-y-2">
              <p class="text-[11px] text-gray-400">모두 투표를 마쳤다면 상단 탭에서 <strong class="text-pumpkin-400">"5. 진범공개"</strong>를 누르거나 아래 버튼을 누르세요.</p>
              <button onclick="changeStage(5)" class="w-full bg-gradient-to-r from-crimson-700 to-crimson-600 hover:from-crimson-600 hover:to-crimson-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-crimson-600/30">
                🚨 전원 투표 완료! 진범 & 전말 공개하기
              </button>
            </div>

        </div>
      `;
      container.appendChild(card);
    }

    function submitVote(targetCharId) {
      if (!currentUser) return;
      votes[currentUser] = targetCharId;
      saveLocalStorage();
      renderVoteTab(document.getElementById('app-viewport'));
    }

    // 60-Minute Countdown Timer
    function toggleTimer() {
      const timerIcon = document.getElementById('timer-icon');
      const timerDisplay = document.getElementById('timer-display');

      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if (timerIcon) timerIcon.innerText = '▶';
        if (timerDisplay) timerDisplay.classList.remove('text-crimson-400', 'animate-pulse');
      } else {
        isTimerRunning = true;
        if (timerIcon) timerIcon.innerText = '⏸';
        if (timerDisplay) timerDisplay.classList.add('text-crimson-400', 'animate-pulse');
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            if (timerIcon) timerIcon.innerText = '▶';
            alert('⏰ 60분이 종료되었습니다! 최종 투표를 진행하세요!');
          }
        }, 1000);
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Toast Notification
    function showToast(message) {
      let toast = document.getElementById('app-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'app-toast';
        toast.className = 'fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-gothic-900/95 border border-pumpkin-500/60 text-white text-xs px-3.5 py-1.5 rounded-full shadow-2xl backdrop-blur-md transition-all duration-300 pointer-events-none opacity-0 flex items-center gap-2';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<span>🎃</span><span>${message}</span>`;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2200);
    }

    // Blueprint Zone Filter
    function filterCluesByZone(zoneId) {
      if (currentStage < 2) {
        currentStage = 2;
        saveLocalStorage();
        updateStageTabStyles();
        updateClueBadgeCount();
      }
      setTab('clues');

      const zone = GAME_DATA.floor_plan ? GAME_DATA.floor_plan.zones.find(z => z.id === zoneId) : null;
      if (zone) {
        showToast(`[${zone.name}] 구역 확인`);
        if (zoneId === 'zone_vip' || (zone && zone.code === 'A-01')) {
          setTimeout(() => {
            openCommonClueModal();
          }, 250);
        }
      }
    }

    // Audio / BGM Synthesizer (Spooky Ambient Synth using Web Audio API)
    let spookyInterval = null;
    async function toggleAudio() {
      const icon = document.getElementById('bgm-icon');

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (isAudioPlaying) {
          stopSpookyMusic();
          isAudioPlaying = false;
          if (icon) icon.className = 'fa-solid fa-volume-xmark text-gray-400';
          showToast('🔇 BGM 음소거');
        } else {
          startSpookyMusic();
          isAudioPlaying = true;
          if (icon) icon.className = 'fa-solid fa-volume-high text-pumpkin-400 animate-pulse';
          showToast('🔊 할로윈 테마 BGM 재생');
        }
      } catch (err) {
        console.error('Audio playback error:', err);
        showToast('⚠️ 오디오 재생 권한을 확인해주세요');
      }
    }

    function startSpookyMusic() {
      stopSpookyMusic();
      playChimeChord();
      spookyInterval = setInterval(() => {
        if (isAudioPlaying) playChimeChord();
      }, 4500);
    }

    function stopSpookyMusic() {
      if (spookyInterval) {
        clearInterval(spookyInterval);
        spookyInterval = null;
      }
    }

    function playChimeChord() {
      if (!audioCtx) return;
      // D minor pentatonic spooky arpeggio notes (D4, F4, A4, C5)
      const freqs = [293.66, 349.23, 440.0, 523.25];
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.25);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + idx * 0.25 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.25 + 1.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + idx * 0.25);
        osc.stop(audioCtx.currentTime + idx * 0.25 + 1.9);
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
